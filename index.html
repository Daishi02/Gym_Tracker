<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Elite Manual</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500&display=swap');
:root{
  --bg:#0d0b14;--bg2:#13101e;--bg3:#1a1628;--bg4:#211d30;
  --border:#2a2440;--border2:#352e50;
  --text:#e8e4f0;--muted:#5a5375;--faint:#1e1a2e;
  --accent:#a855f7;--accent2:#7c3aed;
  --radius:11px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overscroll-behavior:none;}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(72px + var(--safe-bottom));}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:#0d0b14ee;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
.hdr-sub{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:1px;}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:2px;line-height:1;background:linear-gradient(135deg,#e8e4f0 0%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* TABBAR */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0d0b14f5;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:100;}
.tab-btn{flex:1;padding:9px 0;background:none;border:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:color .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab-btn.active{color:var(--accent);}
.tab-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* MAIN */
main{padding:12px 12px 0;}

/* DAY PILLS */
.day-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;margin-bottom:11px;}
.day-row::-webkit-scrollbar{display:none;}
.day-pill{flex-shrink:0;padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;position:relative;text-transform:uppercase;}
.day-pill.active{background:var(--dp-bg);border-color:var(--dp-ac);color:var(--dp-ac);}
.today-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--dp-ac);}

/* SESSION CARD */
.session-card{background:linear-gradient(135deg,var(--bg2) 0%,#1a1030 100%);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:11px;position:relative;overflow:hidden;}
.session-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#a855f722 0%,transparent 70%);pointer-events:none;}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.s-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;border-radius:20px;padding:2px 9px;margin-bottom:6px;display:inline-block;}
.s-theme{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:1px;color:#f0ecff;line-height:1;}
.s-meta{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:3px;}
.s-pct{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;line-height:1;text-align:right;}
.s-pct small{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);font-weight:600;}
.s-sets{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);text-align:right;margin-top:2px;}
.s-notes{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.s-notes-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
.s-notes-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);resize:none;outline:none;transition:border-color .15s;}
.s-notes-inp:focus{border-color:var(--accent);}
.s-notes-inp::placeholder{color:#3a3060;}

/* EXERCISE CARDS */
.ex-list{display:flex;flex-direction:column;gap:6px;}
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s;}
.ex-card.open{border-color:var(--ca);}
.ex-card.skipped{opacity:.35;border-style:dashed;}
/* Superset grouping */
.ss-group{border-left:3px solid var(--ss-color);border-radius:var(--radius);overflow:hidden;margin-bottom:2px;}
.ss-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;color:var(--ss-color);background:var(--ss-color)11;}

.ex-hdr{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;background:none;border:none;cursor:pointer;text-align:left;}
.ex-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;color:#f0ecff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-muscle{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:500;letter-spacing:1px;color:var(--muted);margin-top:2px;text-transform:uppercase;}
.ex-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.ex-done{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:var(--muted);}
.chev{font-size:18px;color:var(--muted);margin-left:2px;transition:transform .2s;flex-shrink:0;}
.ex-card.open .chev{transform:rotate(90deg);color:var(--ca);}
.skip-badge{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;padding:2px 7px;border-radius:20px;background:#ffffff08;color:#4a4060;text-transform:uppercase;}
.pr-badge{font-size:12px;margin-left:2px;}
.wu-badge{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:4px;background:#22304422;color:#4488aa;}

/* SET BODY */
.ex-body{padding:0 12px 12px;}
.ex-meta-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.5px;}
.col-heads{display:grid;grid-template-columns:22px 1fr 1fr 1.6fr 30px;gap:5px;padding:3px 0;margin-bottom:1px;}
.col-head{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:#2e2848;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.set-row{display:grid;grid-template-columns:22px 1fr 1fr 1.6fr 30px;gap:5px;align-items:center;padding:4px 0;border-bottom:1px solid #14141488;}
.set-row.warmup{opacity:.6;}
.set-num{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;text-align:center;}
.set-num.wu{font-size:10px;color:#4488aa;font-weight:700;}
.set-inp{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 7px;font-size:13px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:500;outline:none;width:100%;transition:border-color .15s;-webkit-appearance:none;}
.set-inp:focus{border-color:var(--fi);background:var(--bg4);}
.set-inp::placeholder{color:#2a2440;}
.timer-btn{width:28px;height:28px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.timer-btn.active{background:#1a0a2e;border-color:var(--accent);color:var(--accent);}
.ex-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:10px;gap:7px;}
.skip-btn{background:none;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:6px 13px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.skip-btn.unskip{border-color:#3a1a4a;color:#8844aa;}
.skip-btn.danger{border-color:#3a1a2a;color:#884455;}

/* CUSTOM FORM */
.add-custom-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px;background:transparent;border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;margin-top:4px;}
.custom-form{background:var(--bg2);border:1px solid var(--accent);border-radius:var(--radius);padding:13px;margin-top:4px;}
.custom-form-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:9px;}
.custom-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:9px 10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--text);outline:none;margin-bottom:7px;transition:border-color .15s;}
.custom-inp:focus{border-color:var(--accent);}
.custom-inp::placeholder{color:#2a2440;}
.custom-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.custom-btns{display:flex;gap:7px;margin-top:3px;}
.cbtn{flex:1;padding:9px;border-radius:8px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:1px;cursor:pointer;text-transform:uppercase;}
.cbtn-add{background:var(--accent);color:#0d0b14;}
.cbtn-cancel{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
.custom-tag{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;padding:1px 5px;border-radius:4px;background:#a855f720;color:#a855f7;text-transform:uppercase;margin-left:4px;vertical-align:middle;}

/* REST TIMER */
.timer-overlay{position:fixed;bottom:calc(76px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:150;background:#1a1628;border:1px solid var(--accent);border-radius:13px;padding:12px 18px 12px 68px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px #00000099;min-width:220px;transition:all .3s;}
.timer-overlay.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px);}
.timer-ring{position:absolute;left:14px;top:50%;transform:translateY(-50%);}
.timer-num{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--accent);}
.timer-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-top:1px;}
.timer-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;margin-left:auto;}

/* ── PLANNER TAB ── */
.planner-day-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;margin-bottom:12px;}
.planner-day-row::-webkit-scrollbar{display:none;}
.planner-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:11px;}
.planner-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.planner-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:#f0ecff;}
.planner-subtitle{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:2px;}
.save-tpl-btn{padding:8px 16px;background:var(--accent);color:#0d0b14;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;text-transform:uppercase;}
.save-tpl-btn:active{opacity:.7;}

/* Muscle group filter */
.muscle-filter{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;margin-bottom:10px;}
.muscle-filter::-webkit-scrollbar{display:none;}
.mf-btn{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.mf-btn.active{background:var(--accent)1a;border-color:var(--accent);color:var(--accent);}

/* Exercise picker list */
.picker-list{display:flex;flex-direction:column;gap:5px;max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2a2440 transparent;}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;}
.picker-item.selected{border-color:var(--accent);background:var(--accent)0f;}
.picker-item-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#e0dcf0;flex:1;}
.picker-item-muscle{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
.picker-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:11px;}
.picker-item.selected .picker-check{background:var(--accent);border-color:var(--accent);color:#0d0b14;}

/* Template exercise list (in planner) */
.tpl-ex-list{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.tpl-ex-row{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;}
.tpl-ex-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#e0dcf0;flex:1;}
.tpl-ex-muscle{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.tpl-inp{width:48px;background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:5px 6px;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--text);outline:none;text-align:center;}
.tpl-inp:focus{border-color:var(--accent);}
.tpl-rm-btn{background:none;border:none;color:#4a3060;font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;}
.tpl-rm-btn:active{color:#aa44aa;}
.tpl-options{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.tpl-toggle{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:none;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.5px;cursor:pointer;color:var(--muted);text-transform:uppercase;transition:all .15s;}
.tpl-toggle.on{border-color:var(--tc);color:var(--tc);background:var(--tc)14;}
.section-divider{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin:12px 0 7px;display:flex;align-items:center;gap:8px;}
.section-divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* HISTORY */
.hist-block{margin-bottom:22px;}
.hist-date{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:11px;}
.hist-day-lbl{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.hist-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.hist-dn{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;}
.hist-dt{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);}
.hist-ex{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:5px;}
.hist-ex-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.hist-ex-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#d8d0f0;}
.hist-ex-best{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;}
.hist-set-pills{display:flex;flex-wrap:wrap;gap:4px;}
.hist-set-pill{font-family:'Barlow Condensed',sans-serif;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--faint);color:#5a5375;}
.skipped-pill{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:20px;background:#1a1028;color:#5a3a7a;text-transform:uppercase;}
.hist-notes{font-family:'Barlow',sans-serif;font-size:12px;color:#5a5375;font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}

/* PROGRESS */
.prog-section{margin-bottom:16px;}
.prog-day-picker{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;margin-bottom:12px;}
.prog-day-picker::-webkit-scrollbar{display:none;}
.prog-ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px;overflow:hidden;}
.prog-ex-hdr{padding:11px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.prog-ex-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#f0ecff;}
.prog-ex-muscle{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:2px;}
.prog-ex-pr{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;text-align:right;}
.prog-ex-pr-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);text-align:right;margin-top:2px;}
.chart-wrap{padding:0 13px 13px;}
.chart-empty{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#2e2848;padding:14px 0;text-align:center;}
.bw-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:11px;}
.bw-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;}
.bw-input-row{display:flex;gap:7px;margin-bottom:11px;}
.bw-inp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color .15s;}
.bw-inp:focus{border-color:var(--accent);}
.bw-inp::placeholder{color:#2a2440;}
.bw-log-btn{padding:9px 16px;background:var(--accent);color:#0d0b14;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;text-transform:uppercase;white-space:nowrap;}
.bw-latest{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);margin-bottom:9px;}
.bw-latest span{color:var(--accent);font-weight:700;font-size:15px;}

/* BACKUP */
.bk-section{margin-bottom:20px;}
.bk-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:9px;}
.bk-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.bk-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);}
.bk-row:last-child{border-bottom:none;}
.bk-lbl{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);}
.bk-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);margin-top:2px;}
.bk-val{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--muted);}
.act-btn{padding:7px 14px;border-radius:8px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:opacity .15s;}
.act-btn:active{opacity:.6;}
.btn-p{background:var(--accent);color:#0d0b14;}
.btn-s{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.btn-d{background:#1c0a28;color:#aa44cc;border:1px solid #3a1050;}

/* MISC */
.empty-state{text-align:center;margin-top:60px;font-family:'Barlow Condensed',sans-serif;font-size:15px;color:#2e2848;line-height:2.2;}

function getTemplate(day){

  if(!logs._templates) logs._templates={};

/* ═══════════════════════════════
   BASIC HELPERS
═══════════════════════════════ */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function todayDay(){ const d=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()]; return DAYS.includes(d)?d:DAYS[0]; }
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function isSkipped(exId){ return logs?.[todayISO()]?.[activeDay]?._skipped?.[exId]===true; }
function toggleSkip(exId){
  const d=todayISO();
  if(!logs[d]) logs[d]={};
  if(!logs[d][activeDay]) logs[d][activeDay]={};
  if(!logs[d][activeDay]._skipped) logs[d][activeDay]._skipped={};
  logs[d][activeDay]._skipped[exId]=!logs[d][activeDay]._skipped[exId];
  saveLogs();
}
function getSet(exId,i){ return logs?.[todayISO()]?.[activeDay]?.[exId]?.[i]||{weight:"",reps:"",note:""}; }
function setField(exId,i,field,val){
  const d=todayISO();
  if(!logs[d]) logs[d]={};
  if(!logs[d][activeDay]) logs[d][activeDay]={};
  if(!logs[d][activeDay][exId]) logs[d][activeDay][exId]={};
  if(!logs[d][activeDay][exId][i]) logs[d][activeDay][exId][i]={};
  logs[d][activeDay][exId][i][field]=val;
  saveLogs(); refreshRing(exId); refreshSessionPct();
}
function countDone(exId){ const s=logs?.[todayISO()]?.[activeDay]?.[exId]||{}; return Object.values(s).filter(x=>x.weight||x.reps).length; }

function getAllExercises(){
  const tpl=getTemplate(activeDay);
  const custom=logs?.[todayISO()]?.[activeDay]?._custom||[];
  return [...tpl.exercises,...custom];
}

function sessionProg(){
  const all=getAllExercises();
  const dl=logs?.[todayISO()]?.[activeDay]||{};
  const total=all.reduce((a,e)=>a+(e.sets+(e.warmup?2:0)),0);
  const done=all.reduce((a,ex)=>{
    if(dl._skipped?.[ex.id]) return a+ex.sets+(ex.warmup?2:0);
    const logged=Object.values(dl[ex.id]||{}).filter(s=>s.weight||s.reps).length;
    return a+logged;
  },0);
  return{done,total,pct:total?Math.round((done/total)*100):0};
}

function getNotes(){ return logs?.[todayISO()]?.[activeDay]?._notes||""; }
function setNotes(val){
  const d=todayISO();
  if(!logs[d]) logs[d]={};
  if(!logs[d][activeDay]) logs[d][activeDay]={};
  logs[d][activeDay]._notes=val;
  saveLogs();
}

/* PR */
function isPR(exId,weight){
  if(!weight) return false;
  const w=parseFloat(weight); if(!w) return false;
  const today=todayISO();
  let best=0;
  Object.entries(logs).filter(([k])=>!['_bodyweight','_templates'].includes(k)).forEach(([date,dl])=>{
    if(date>=today) return;
    Object.values(dl).forEach(exMap=>{
      if(typeof exMap!=='object'||!exMap[exId]) return;
      Object.values(exMap[exId]).forEach(s=>{ const v=parseFloat(s.weight)||0; if(v>best) best=v; });
    });
  });
  return w>best&&best>0;
}

/* Bodyweight */
function getBWLog(){ return logs?._bodyweight||[]; }
function logBW(val){
  if(!logs._bodyweight) logs._bodyweight=[];
  const today=todayISO();
  const ei=logs._bodyweight.findIndex(e=>e.date===today);
  if(ei>=0) logs._bodyweight[ei].kg=val;
  else logs._bodyweight.push({date:today,kg:val});
  logs._bodyweight.sort((a,b)=>a.date.localeCompare(b.date));
  saveLogs();
}

/* Custom exercises */
function getCustomEx(){ return logs?.[todayISO()]?.[activeDay]?._custom||[]; }
function addCustomEx(name,muscle,sets,rep){
  const d=todayISO();
  if(!logs[d]) logs[d]={};
  if(!logs[d][activeDay]) logs[d][activeDay]={};
  if(!logs[d][activeDay]._custom) logs[d][activeDay]._custom=[];
  const id=`custom_${Date.now()}`;
  logs[d][activeDay]._custom.push({id,name,muscle,sets:parseInt(sets)||3,rep:rep||"—",rest:60,warmup:false,supersetWith:null,custom:true});
  saveLogs(); return id;
}
function removeCustomEx(id){
  const d=todayISO();
  if(!logs[d]?.[activeDay]?._custom) return;
  logs[d][activeDay]._custom=logs[d][activeDay]._custom.filter(e=>e.id!==id);
  saveLogs();
}

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); }

/* ═══════════════════════════════
   REST TIMER
═══════════════════════════════ */
function startTimer(seconds,exId){
  stopTimer();
  if(!seconds) return;
  timerTotal=seconds; timerLeft=seconds;
  const overlay=document.getElementById("timer-overlay");
  const numEl=document.getElementById("timer-num");
  const arc=document.getElementById("timer-arc");
  const C=113.1;
  overlay.classList.remove("hidden");
  numEl.textContent=fmt(timerLeft);
  arc.setAttribute("stroke-dashoffset","0");
  document.querySelectorAll(".timer-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`[data-timer="${exId}"]`)?.classList.add("active");
  timerInterval=setInterval(()=>{
    timerLeft--;
    numEl.textContent=fmt(timerLeft);
    arc.setAttribute("stroke-dashoffset",(C*(1-timerLeft/timerTotal)).toFixed(2));
    if(timerLeft<=0){ stopTimer(); if(navigator.vibrate) navigator.vibrate([200,100,200]); toast("✓ Rest complete — next set!"); }
  },1000);
}
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  document.getElementById("timer-overlay").classList.add("hidden");
  document.querySelectorAll(".timer-btn").forEach(b=>b.classList.remove("active"));
}

/* ═══════════════════════════════
   RING SVG
═══════════════════════════════ */
function ringHTML(exId,accent,pct){
  const R=12,C=2*Math.PI*R,off=C*(1-pct);
  return `<svg width="30" height="30" viewBox="0 0 30 30" style="flex-shrink:0;transform:rotate(-90deg)" data-ring="${exId}">
    <circle cx="15" cy="15" r="${R}" fill="none" stroke="#1e1a2e" stroke-width="3"/>
    <circle cx="15" cy="15" r="${R}" fill="none" stroke="${pct>0?accent:'#2a2440'}" stroke-width="3"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="transition:stroke-dashoffset .35s"/>
  </svg>`;
}
function refreshRing(exId){
  const all=getAllExercises();
  const ex=all.find(e=>e.id===exId); if(!ex) return;
  const pct=Math.min(countDone(exId)/ex.sets,1);
  const R=12,C=2*Math.PI*R;
  const arc=document.querySelector(`[data-ring="${exId}"] circle:last-child`);
  if(arc){ arc.setAttribute("stroke-dashoffset",(C*(1-pct)).toFixed(2)); arc.setAttribute("stroke",pct>0?getDayAccent(activeDay):"#2a2440"); }
  const el=document.querySelector(`[data-done="${exId}"]`);
  if(el) el.textContent=`${countDone(exId)}/${ex.sets}`;
}
function refreshSessionPct(){

/* ═══════════════════════════════

═══════════════════════════════ */
function exCardHTML(ex, accent, isCustom=false){
  const skipped=isSkipped(ex.id);
  const done2=skipped?ex.sets:countDone(ex.id);
  const pctEx=Math.min(done2/ex.sets,1);
  const isOpen=openCards[ex.id]&&!skipped;
  const restSec=ex.rest||0;
  const hasWarmup=ex.warmup&&!isCustom;
  const ssColor=ex.supersetWith?"#f59e0b":null;

  // PR check
  const todaySets=logs?.[todayISO()]?.[activeDay]?.[ex.id]||{};
  let hasPR=false;
  Object.values(todaySets).forEach(s=>{ if(isPR(ex.id,s.weight)) hasPR=true; });

  let body="";
  if(isOpen){
    // Warmup rows
    let wuRows="";
    if(hasWarmup){
      wuRows=`
        <div class="set-row warmup"><span class="set-num wu">W1</span><input class="set-inp" style="--fi:#4488aa" placeholder="kg/lb" value="${getSet(ex.id,'wu1').weight||""}" oninput="setField('${ex.id}','wu1','weight',this.value)"/><input class="set-inp" style="--fi:#4488aa" placeholder="reps" value="${getSet(ex.id,'wu1').reps||""}" oninput="setField('${ex.id}','wu1','reps',this.value)"/><input class="set-inp" style="--fi:#4488aa" placeholder="note…" value="${getSet(ex.id,'wu1').note||""}" oninput="setField('${ex.id}','wu1','note',this.value)"/><div></div></div>
        <div class="set-row warmup"><span class="set-num wu">W2</span><input class="set-inp" style="--fi:#4488aa" placeholder="kg/lb" value="${getSet(ex.id,'wu2').weight||""}" oninput="setField('${ex.id}','wu2','weight',this.value)"/><input class="set-inp" style="--fi:#4488aa" placeholder="reps" value="${getSet(ex.id,'wu2').reps||""}" oninput="setField('${ex.id}','wu2','reps',this.value)"/><input class="set-inp" style="--fi:#4488aa" placeholder="note…" value="${getSet(ex.id,'wu2').note||""}" oninput="setField('${ex.id}','wu2','note',this.value)"/><div></div></div>`;
    }
    const rows=Array.from({length:ex.sets},(_,i)=>{
      const s=getSet(ex.id,i),filled=s.weight||s.reps;
      return `<div class="set-row">
        <span class="set-num" style="color:${filled?accent:"#2e2848"}">${i+1}</span>
        <input class="set-inp" style="--fi:${accent}" placeholder="kg/lb" value="${s.weight||""}" oninput="setField('${ex.id}',${i},'weight',this.value)"/>
        <input class="set-inp" style="--fi:${accent}" placeholder="reps" value="${s.reps||""}" oninput="setField('${ex.id}',${i},'reps',this.value)"/>
        <input class="set-inp" style="--fi:${accent}" placeholder="note…" value="${s.note||""}" oninput="setField('${ex.id}',${i},'note',this.value)"/>
        ${restSec?`<button class="timer-btn" data-timer="${ex.id}" onclick="startTimer(${restSec},'${ex.id}')">⏱</button>`:`<div></div>`}
      </div>`;
    }).join("");
    const restFmt=restSec>=60?`${restSec/60}m rest`:restSec?`${restSec}s rest`:"";
    body=`<div class="ex-body">
      <div class="ex-meta-row">
        ${ex.rep&&ex.rep!=="—"?`<span class="pill" style="background:#a855f711;color:#6a5090">Target: ${ex.rep}</span>`:""}
        ${restFmt?`<span class="pill" style="background:#a855f711;color:#6a5090">${restFmt}</span>`:""}
        ${hasWarmup?`<span class="wu-badge">Warm-up included</span>`:""}
      </div>
      <div class="col-heads"><div class="col-head"></div><div class="col-head">Weight</div><div class="col-head">Reps</div><div class="col-head">Note</div><div class="col-head"></div></div>
      ${wuRows}${rows}
      <div class="ex-actions">
        ${isCustom?`<button class="skip-btn danger" onclick="removeCustom('${ex.id}')">Remove</button>`:`<button class="skip-btn" onclick="doSkip('${ex.id}')">Skip</button>`}
      </div>
    </div>`;
  }

  const cardInner=`<div class="ex-card${isOpen?" open":""}${skipped?" skipped":""}" style="--ca:${accent}" id="card-${ex.id}">
    <button class="ex-hdr" onclick="toggleCard('${ex.id}')">
      ${ringHTML(ex.id,accent,pctEx)}
      <div style="flex:1;min-width:0">
        <div class="ex-name">${ex.name}${isCustom?`<span class="custom-tag">Custom</span>`:""}</div>
        <div class="ex-muscle">${ex.muscle||""}</div>
      </div>
      <div class="ex-right">
        ${skipped?`<span class="skip-badge">Skipped</span>`:""}
        ${hasPR&&!skipped?`<span class="pr-badge">🏆 PR</span>`:""}
        <span class="ex-done" data-done="${ex.id}" style="color:${done2>=ex.sets&&done2>0?accent:"var(--muted)"}">${done2}/${ex.sets}</span>
      </div>
      ${!skipped?`<span class="chev">›</span>`:""}
    </button>
    ${body}
    ${skipped?`<div style="padding:0 12px 11px;display:flex;justify-content:flex-end"><button class="skip-btn unskip" onclick="doSkip('${ex.id}')">Undo Skip</button></div>`:""}
  </div>`;

  // Wrap in superset group if needed
  if(ssColor&&!isCustom){
    return `<div class="ss-group" style="--ss-color:${ssColor}"><div class="ss-label">Superset</div>${cardInner}</div>`;
  }
  return cardInner;
}

/* Planner actions */
function plannerSelectDay(d){
  plannerDay=d;
  plannerFilter="All";
  renderPlanner();
}
function togglePickerEx(dbId,day){
  if(!plannerDraft[day]) plannerDraft[day]=[...getTemplate(day).exercises];
  const draft=plannerDraft[day];
  const idx=draft.findIndex(e=>e.id===dbId);
  if(idx>=0){
    draft.splice(idx,1);
  } else {
    const dbEx=DB.find(e=>e.id===dbId);
    if(dbEx) draft.push({...dbEx,sets:3,rep:"8–12",warmup:false,supersetWith:null});
  }
  renderPlanner();
}
function draftSetSets(day,exId,val){
  if(!plannerDraft[day]) return;
  const ex=plannerDraft[day].find(e=>e.id===exId);
  if(ex) ex.sets=parseInt(val)||3;
}
function draftToggle(day,exId,field){
  if(!plannerDraft[day]) return;
  const draft=plannerDraft[day];
  const ex=draft.find(e=>e.id===exId);
  if(!ex) return;
  if(field==="warmup"){ ex.warmup=!ex.warmup; }
  if(field==="superset"){
    const idx=draft.indexOf(ex);
    const next=draft[idx+1];
    if(next){
      if(ex.supersetWith){ ex.supersetWith=null; }
      else { ex.supersetWith=next.id; }
    }
  }
  renderPlanner();
}
function draftRemove(day,exId){
  if(!plannerDraft[day]) return;
  plannerDraft[day]=plannerDraft[day].filter(e=>e.id!==exId);
  // Clean up superset refs
  plannerDraft[day].forEach(e=>{ if(e.supersetWith===exId) e.supersetWith=null; });
  renderPlanner();
}
function saveCurrentTemplate(){
  const base=getTemplate(plannerDay);
  const draft=plannerDraft[plannerDay];
  if(!draft||!draft.length){ toast("Add at least one exercise"); return; }
  const tpl={...base,exercises:draft.map(e=>({...e}))};
  saveTemplate(plannerDay,tpl);
  toast(`✓ ${plannerDay} template saved`);
  renderPlanner();
}

function getExHistory(exId){
  const pts=[];
  Object.entries(logs).filter(([k])=>!['_bodyweight','_templates'].includes(k))
    .sort(([a],[b])=>a.localeCompare(b)).forEach(([date,dl])=>{
      Object.values(dl).forEach(exMap=>{
        if(typeof exMap!=='object'||Array.isArray(exMap)||!exMap[exId]) return;
        const ws=Object.values(exMap[exId]).map(s=>parseFloat(s.weight)||0).filter(w=>w>0);
        if(ws.length) pts.push({date,max:Math.max(...ws)});
      });
    });
  return pts;
}
function drawChart(pts,accent,cid){
  const el=document.getElementById(cid); if(!el) return;
  if(!pts.length){ el.innerHTML=`<div class="chart-empty">No weight data yet.</div>`; return; }
  const W=el.clientWidth||300,H=140,pad={t:16,r:12,b:28,l:38};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const maxW=Math.max(...pts.map(p=>p.max)),minW=Math.min(...pts.map(p=>p.max)),range=maxW-minW||1;
  const xs=pts.map((_,i)=>pad.l+(i/Math.max(pts.length-1,1))*cw);
  const ys=pts.map(p=>pad.t+ch*(1-(p.max-minW)/range));
  let path=`M${xs[0]},${ys[0]}`;
  for(let i=1;i<pts.length;i++){const mx=(xs[i-1]+xs[i])/2;path+=` C${mx},${ys[i-1]} ${mx},${ys[i]} ${xs[i]},${ys[i]}`;}
  let area=`M${xs[0]},${H-pad.b} L${xs[0]},${ys[0]}`;
  for(let i=1;i<pts.length;i++){const mx=(xs[i-1]+xs[i])/2;area+=` C${mx},${ys[i-1]} ${mx},${ys[i]} ${xs[i]},${ys[i]}`;}
  area+=` L${xs[xs.length-1]},${H-pad.b} Z`;
  const step=Math.max(1,Math.ceil(pts.length/5));
  let xl="",yl="";
  for(let i=0;i<pts.length;i+=step) xl+=`<text x="${xs[i]}" y="${H-5}" text-anchor="middle" fill="#3a3060" font-size="9" font-family="Barlow Condensed,sans-serif" font-weight="600">${pts[i].date.slice(5)}</text>`;
  for(let t=0;t<=2;t++){
    const val=(minW+range*(t/2)).toFixed(1),yy=pad.t+ch*(1-t/2);
    yl+=`<text x="${pad.l-5}" y="${yy+4}" text-anchor="end" fill="#3a3060" font-size="9" font-family="Barlow Condensed,sans-serif" font-weight="600">${val}</text>`;
    yl+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#1e1a2e" stroke-width="1"/>`;
  }
  const dots=pts.map((p,i)=>`<circle cx="${xs[i]}" cy="${ys[i]}" r="3.5" fill="${accent}"/>`).join("");
  el.innerHTML=`<svg width="${W}" height="${H}" style="overflow:visible">
    <defs><linearGradient id="g-${cid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${accent}" stop-opacity=".2"/>
      <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
    </linearGradient></defs>
    ${yl}<path d="${area}" fill="url(#g-${cid})"/>
    <path d="${path}" fill="none" stroke="${accent}" stroke-width="2" stroke-linecap="round"/>
    ${dots}${xl}
  </svg>`;
}

  else document.getElementById("bw-chart").innerHTML=`<div class="chart-empty">Log at least 2 entries to see trend.</div>`;

/* ═══════════════════════════════
   RENDER: HISTORY

function renderHistory(){
  const sessions=Object.entries(logs)
    .filter(([k])=>!['_bodyweight','_templates'].includes(k))
    .sort(([a],[b])=>b.localeCompare(a))
    .filter(([,dl])=>Object.entries(dl).some(([k,ex])=>!['_skipped','_custom','_notes'].includes(k)&&typeof ex==='object'&&Object.values(ex).some(s=>Object.values(s).some(x=>x.weight||x.reps))));
  if(!sessions.length){ document.getElementById("main").innerHTML=`<div class="empty-state">No sessions yet.</div>`; return; }
  const html=sessions.map(([date,dayLogs])=>{
    const dateStr=new Date(date+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    const daysHtml=Object.entries(dayLogs).map(([day,exercises])=>{
      if(['_skipped','_custom','_notes'].includes(day)) return "";
      const tpl=getTemplate(day); if(!tpl) return "";
      const accent=tpl.accent;
      const skipped=dayLogs._skipped||{};
      const notes=dayLogs._notes||"";
      const customEx=dayLogs._custom||[];
      const allEx=[...tpl.exercises,...customEx];
      const exRows=Object.entries(exercises).map(([exId,sets])=>{
        if(['_skipped','_custom','_notes'].includes(exId)) return "";
        const ex=allEx.find(e=>e.id===exId)||DB.find(e=>e.id===exId); if(!ex) return "";
        const filled=Object.entries(sets).filter(([k,s])=>!['wu1','wu2'].includes(k)&&(s.weight||s.reps));
        if(!filled.length) return "";
        const best=filled.reduce((acc,[,s])=>{const v=(parseFloat(s.weight)||0)*(parseFloat(s.reps)||0);return v>acc.v?{v,s}:acc;},{v:0,s:null});
        const pills=filled.map(([,s])=>`<span class="hist-set-pill">${s.weight||"—"}kg×${s.reps||"—"}${s.note?` · ${s.note}`:""}</span>`).join("");
        const bestHtml=best.s?`<span class="hist-ex-best" style="color:${accent}">Best ${best.s.weight}kg×${best.s.reps}</span>`:"";
        return `<div class="hist-ex"><div class="hist-ex-hdr"><span class="hist-ex-name">${ex.name}${ex.custom?`<span class="custom-tag">Custom</span>`:""}</span>${bestHtml}</div><div class="hist-set-pills">${pills}</div></div>`;
      }).join("");
      const skippedRows=tpl.exercises.filter(e=>skipped[e.id]).map(e=>`<div class="hist-ex"><div class="hist-ex-hdr"><span class="hist-ex-name" style="color:#3a3060">${e.name}</span><span class="skipped-pill">Skipped</span></div></div>`).join("");
      if(!exRows.trim()&&!skippedRows.trim()) return "";
      return `<div style="margin-bottom:12px">
        <div class="hist-day-lbl"><div class="hist-dot" style="background:${accent}"></div><span class="hist-dn" style="color:${accent}">${tpl.label}</span><span class="hist-dt">— ${tpl.theme}</span></div>
        ${exRows}${skippedRows}
        ${notes?`<div class="hist-notes">"${notes}"</div>`:""}
      </div>`;
    }).join("");
    if(!daysHtml.trim()) return "";
    return `<div class="hist-block"><div class="hist-date">${dateStr}</div>${daysHtml}</div>`;
  }).join("");
  document.getElementById("main").innerHTML=html||`<div class="empty-state">No data.</div>`;
}

/* ═══════════════════════════════
   RENDER: BACKUP
═══════════════════════════════ */
function renderBackup(){
  const sCount=Object.keys(logs).filter(k=>!['_bodyweight','_templates'].includes(k)).length;
  const setCount=Object.entries(logs).filter(([k])=>!['_bodyweight','_templates'].includes(k))
    .reduce((a,[,dl])=>a+Object.entries(dl).reduce((b,[k,ex])=>{
      if(['_skipped','_custom','_notes'].includes(k)) return b;
      return b+Object.values(ex).reduce((c,sets)=>c+Object.values(sets).filter(s=>s.weight||s.reps).length,0);
    },0),0);
  const tplCount=Object.keys(logs._templates||{}).length;
  const tplDays=Object.keys(logs._templates||{}).join(", ")||"None saved";
  const last=Object.keys(logs).filter(k=>!['_bodyweight','_templates'].includes(k)).sort().reverse()[0];
  const lastStr=last?new Date(last+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
  document.getElementById("main").innerHTML=`
    <div class="bk-section">
      <div class="bk-title">Your Data</div>
      <div class="bk-card">
        <div class="bk-row"><div><div class="bk-lbl">Sessions Logged</div></div><div class="bk-val">${sCount}</div></div>
        <div class="bk-row"><div><div class="bk-lbl">Sets Recorded</div></div><div class="bk-val">${setCount}</div></div>
        <div class="bk-row"><div><div class="bk-lbl">Last Session</div></div><div class="bk-val">${lastStr}</div></div>
      </div>
    </div>

    <div class="bk-section">
      <div class="bk-title">Workout History</div>
      <div class="bk-card">
        <div class="bk-row"><div><div class="bk-lbl">Export History</div><div class="bk-sub">Saves sessions, sets & bodyweight log</div></div><button class="act-btn btn-p" onclick="exportHistory()">Export</button></div>
        <div class="bk-row"><div><div class="bk-lbl">Import History</div><div class="bk-sub">Restore from a history .json</div></div><button class="act-btn btn-s" onclick="triggerImport('history')">Import</button></div>
      </div>
    </div>

    <div class="bk-section">
      <div class="bk-title">Templates</div>
      <div class="bk-card">
        <div class="bk-row"><div><div class="bk-lbl">Saved Days</div></div><div class="bk-val" style="font-size:12px;text-align:right;max-width:160px">${tplDays}</div></div>
        <div class="bk-row"><div><div class="bk-lbl">Export Templates</div><div class="bk-sub">Share your routines with friends</div></div><button class="act-btn btn-p" onclick="exportTemplates()">Export</button></div>
        <div class="bk-row"><div><div class="bk-lbl">Import Templates</div><div class="bk-sub">Load a friend's template file</div></div><button class="act-btn btn-s" onclick="triggerImport('templates')">Import</button></div>
      </div>
    </div>

    <div class="bk-section">
      <div class="bk-title">Danger Zone</div>
      <div class="bk-card">
        <div class="bk-row"><div><div class="bk-lbl">Clear History</div><div class="bk-sub">Deletes sessions, keeps templates</div></div><button class="act-btn btn-d" onclick="clearHistory()">Clear</button></div>
        <div class="bk-row"><div><div class="bk-lbl">Clear Templates</div><div class="bk-sub">Resets to default plan</div></div><button class="act-btn btn-d" onclick="clearTemplates()">Clear</button></div>
        <div class="bk-row"><div><div class="bk-lbl">Clear Everything</div><div class="bk-sub">Wipes all data completely</div></div><button class="act-btn btn-d" onclick="clearData()">Clear All</button></div>
      </div>
    </div>`;
}

/* ═══════════════════════════════
   ACTIONS
═══════════════════════════════ */
function selectDay(d){ activeDay=d; openCards={}; showCustomForm=false; renderTrain(); }
function progSelectDay(d){ progDay=d; openProgCards={}; renderProgress(); }

function toggleCard(exId){
  if(isSkipped(exId)) return;
  openCards[exId]=!openCards[exId]; renderTrain();
  if(openCards[exId]) setTimeout(()=>document.getElementById(`card-${exId}`)?.scrollIntoView({behavior:"smooth",block:"nearest"}),60);
}
function toggleProgCard(exId,accent){
  openProgCards[exId]=!openProgCards[exId]; renderProgress();
  if(openProgCards[exId]) setTimeout(()=>drawChart(getExHistory(exId),accent,`chart-${exId}`),80);
}
function doSkip(exId){ toggleSkip(exId); if(openCards[exId]) openCards[exId]=false; renderTrain(); }

function submitCustom(){
  const name=document.getElementById("cf-name")?.value?.trim();
  if(!name){ toast("Enter an exercise name"); return; }
  const muscle=document.getElementById("cf-muscle")?.value?.trim()||"";
  const sets=document.getElementById("cf-sets")?.value||"3";
  const rep=document.getElementById("cf-rep")?.value?.trim()||"—";
  addCustomEx(name,muscle,sets,rep);
  showCustomForm=false; renderTrain(); toast("✓ Exercise added");
}
function removeCustom(id){ removeCustomEx(id); delete openCards[id]; renderTrain(); }
function logBWEntry(){
  const val=document.getElementById("bw-inp")?.value?.trim();
  if(!val||isNaN(parseFloat(val))){ toast("Enter a valid weight"); return; }
  logBW(parseFloat(val)); toast(`✓ Logged ${val} kg`); renderProgress();
}

function switchTab(tab){
  activeTab=tab; showCustomForm=false;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  if(tab==="train") renderTrain();
  else if(tab==="planner") renderPlanner();
  else if(tab==="progress") renderProgress();
  else if(tab==="history") renderHistory();
  else if(tab==="backup") renderBackup();
}

// ── EXPORT ──
function dlJSON(data, filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportHistory(){
  // Everything except templates
  const out={};
  Object.entries(logs).forEach(([k,v])=>{ if(k!=='_templates') out[k]=v; });
  dlJSON(out,`elite-history-${todayISO()}.json`);
  toast("✓ History exported");
}
function exportTemplates(){
  const tpls=logs._templates||{};
  if(!Object.keys(tpls).length){ toast("No custom templates saved yet"); return; }
  dlJSON({_templates:tpls},`elite-templates-${todayISO()}.json`);
  toast("✓ Templates exported — share with friends!");
}

// ── IMPORT ──
let _importMode="history";
function triggerImport(mode){
  _importMode=mode;
  document.getElementById("file-import").click();
}
function importFile(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const imp=JSON.parse(ev.target.result);
      if(typeof imp!=="object") throw 0;
      if(_importMode==="templates"){
        if(!imp._templates) throw new Error("No templates found in file");
        logs._templates=Object.assign({},logs._templates||{},imp._templates);
        plannerDraft={};
        saveLogs(); toast(`✓ Templates imported for: ${Object.keys(imp._templates).join(", ")}`);
      } else {
        // History import — merge everything except don't overwrite templates
        const existingTpls=logs._templates;
        Object.entries(imp).forEach(([k,v])=>{ if(k!=='_templates') logs[k]=v; });
        if(existingTpls) logs._templates=existingTpls;
        saveLogs(); toast("✓ History imported successfully");
      }
      renderBackup();
    }catch(err){ toast("✗ Invalid file — "+( err.message||"check format")); }
    e.target.value="";
  };
  r.readAsText(file);
}

// ── CLEAR ──
function clearHistory(){ if(!confirm("Delete all session history? Templates are kept.")) return; const tpls=logs._templates,bw=logs._bodyweight; logs={}; if(tpls) logs._templates=tpls; if(bw) logs._bodyweight=bw; saveLogs(); toast("History cleared"); renderBackup(); }
function clearTemplates(){ if(!confirm("Reset all templates to default plan?")) return; delete logs._templates; plannerDraft={}; saveLogs(); toast("Templates reset to default"); renderBackup(); }
function clearData(){ if(!confirm("Delete ALL data including templates? Cannot be undone.")) return; logs={}; saveLogs(); plannerDraft={}; toast("All data cleared"); renderBackup(); }

/* ═══════════════════════════════
   BOOT
═══════════════════════════════ */
loadLogs();
renderTrain();
</script>
